name: Build traP image
permissions: {}

on:
  push:
    branches:
      - traP
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  docker-build:
    name: Build and publish GHCR image
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: Setup Docker Buildx
        uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4.4.1
        with:
          cache-binary: false
          buildkitd-config-inline: |
            [worker.oci]
              max-parallelism = 2

      - name: Login to GitHub Container Registry
        uses: docker/login-action@dbcb813823bdd20940b903addbd779551569679f # v4.6.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Determine source version
        run: |
          LAST_TAG="$(git describe --tags --abbrev=0 2>/dev/null || echo 0.0.0)"
          echo "SOURCE_VERSION=${LAST_TAG}-${GITHUB_SHA::8}" >> "$GITHUB_ENV"

      - name: Prepare image name
        id: image
        run: echo "name=ghcr.io/${GITHUB_REPOSITORY,,}" >> "$GITHUB_OUTPUT"

      - name: Bake and push Debian image
        uses: docker/bake-action@018cb6412ab401ebaa809aa5f85966b74628600f # v7.4.0
        env:
          CONTAINER_REGISTRIES: ${{ steps.image.outputs.name }}
          BASE_TAGS: trap
          SOURCE_COMMIT: ${{ github.sha }}
          SOURCE_REPOSITORY_URL: https://github.com/${{ github.repository }}
          SOURCE_VERSION: ${{ env.SOURCE_VERSION }}
        with:
          files: docker/docker-bake.hcl
          targets: debian-multi
          set: |
            *.platform=linux/amd64
            *.cache-from=type=gha,scope=trap-debian
            *.cache-to=type=gha,scope=trap-debian,mode=max
